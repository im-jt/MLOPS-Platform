<div class="flex flex-col h-screen font-sans bg-slate-100 text-slate-800">
    <!-- Header -->
    <header class="flex-shrink-0 bg-white/80 backdrop-blur-sm border-b border-slate-200 z-30">
        <div class="px-6 py-2 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <a routerLink="/" class="flex items-center space-x-2 text-sm text-slate-600 font-semibold hover:text-purple-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span>Data Science Lab</span>
                </a>
                <div class="h-5 border-l border-slate-200"></div>
                <div class="flex items-center">
                    @if (isEditingName()) {
                        <input #nameInput type="text" [value]="workflowName()" (blur)="saveName($event)" (keydown.enter)="saveName($event)" (keydown.escape)="cancelEditName()" class="px-2 py-0.5 border border-slate-300 rounded focus:outline-none focus:ring-0 text-base font-semibold text-slate-800 bg-white">
                    } @else {
                        <h1 (click)="editName()" class="text-base font-semibold text-slate-800 cursor-pointer hover:bg-slate-100 px-2 py-0.5 rounded transition-colors">{{ workflowName() }}</h1>
                    }
                </div>
            </div>
            <div class="flex items-center space-x-4 text-sm text-slate-500">
                <span class="text-xs">Autosaved</span>
            </div>
        </div>
    </header>
    
    <main class="flex-1 overflow-y-auto p-6">
        <div class="max-w-4xl mx-auto">
            <app-mlops-panel></app-mlops-panel>
        </div>
    </main>
</div>
